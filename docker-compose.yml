# IA docker-compose.yml
services:
  fernanda-ai:
    build: .
    container_name: fernanda-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    networks:           
      - fernanda-network
    extra_hosts:
      - "host.docker.internal:host-gateway" 

networks:
  fernanda-network:
    external: true